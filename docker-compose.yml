version: '3.8'
services:
  stac-esg-app:
    build: .
    container_name: stac-esg-app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ~/.streamlit:/root/.streamlit
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - STREAMLIT_SERVER_WATCH_DIRS=.
    env_file:
      - .env
    restart: unless-stopped