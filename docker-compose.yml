version: '3'
services:
  web:
    build: .
    ports:
      - "8501:8080"  # Changed to use 8501 on host
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_PORT=8080
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - .:/app
    command: streamlit run --server.port 8080 --server.address 0.0.0.0 STAC_searchGPT.py