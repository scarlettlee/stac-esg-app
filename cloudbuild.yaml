steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/stac-esg-app', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/stac-esg-app']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'stac-esg-app'
    - '--image'
    - 'gcr.io/$PROJECT_ID/stac-esg-app'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--min-instances'
    - '0'
    - '--max-instances'
    - '1'
    - '--memory'
    - '1Gi'

images:
  - 'gcr.io/$PROJECT_ID/stac-esg-app'